<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RSA Playground</title><style>body{font:16px system-ui;background:#0d1525;color:#f1f5ff;max-width:760px;margin:35px auto;padding:16px}section{background:#19283e;padding:22px;border-radius:16px;margin:16px 0}input,select{width:100%;margin:12px 0;accent-color:#55e0a7}select,button{padding:12px;background:#30445e;color:white;border:1px solid #65809d;border-radius:8px}button{cursor:pointer}.keys{display:grid;grid-template-columns:1fr 1fr;gap:12px}.key{background:#101d30;padding:15px;border-radius:10px}.number{font-size:2rem;color:#65e5ae;font-weight:bold}.muted{color:#acbed3}.step{padding:8px;border-bottom:1px solid #35475f}code{overflow-wrap:anywhere}@media(max-width:500px){.keys{grid-template-columns:1fr}}</style></head><body><h1>🔐 RSA Playground</h1><p class="muted">Interactive educational RSA demonstration: p = 5, q = 11, n = 55, φ(n) = 40.</p><section><label for="msg">Original message P: <strong id="mv">7</strong></label><input id="msg" type="range" min="0" max="54" value="7"><label for="ex">Public exponent e</label><select id="ex"></select><div class="keys"><div class="key">🔓 Public key<div id="pub" class="number"></div></div><div class="key">🔑 Private key<div id="priv" class="number"></div></div></div></section><section><h2>Encryption</h2><p id="ef"></p><div id="cipher" class="number"></div><h2>Decryption</h2><p id="df"></p><div id="plain" class="number"></div><p id="status"></p></section><button id="reset">↻ Reset</button><p class="muted">Educational only: tiny primes and textbook RSA are not secure. Production RSA encryption uses large keys and secure padding such as OAEP.</p><script>const msg=document.getElementById('msg'),ex=document.getElementById('ex');function gcd(a,b){while(b)[a,b]=[b,a%b];return a}function powmod(a,e,n){let r=1n,steps=[],power=1n;a%=n;while(e>0n){let used=e%2n===1n;if(used)r=r*a%n;steps.push({power,a,used,r});a=a*a%n;e/=2n;power*=2n}return {r,steps}}for(let i=2;i<40;i++)if(gcd(i,40)===1){let o=document.createElement('option');o.value=i;o.textContent='e = '+i;ex.append(o)}function render(id,steps){document.getElementById(id).replaceChildren(...steps.map(s=>{let el=document.createElement('div');el.className='step';el.textContent=`Power ${s.power}: remainder ${s.a}; ${s.used?'multiply':'skip'}; accumulator ${s.r}`;return el}))}function update(){let m=BigInt(msg.value),e=BigInt(ex.value),d=1n;while(e*d%40n!==1n)d++;let c=powmod(m,e,55n),p=powmod(c.r,d,55n);document.getElementById('mv').textContent=m;document.getElementById('pub').textContent=`(${e}, 55)`;document.getElementById('priv').textContent=`(${d}, 55)`;document.getElementById('ef').textContent=`${m}^${e} mod 55 =`;document.getElementById('df').textContent=`${c.r}^${d} mod 55 =`;document.getElementById('cipher').textContent=c.r;document.getElementById('plain').textContent=p.r;document.getElementById('status').textContent=p.r===m?'✓ Original message recovered!':'Error'}msg.addEventListener('input',update);ex.addEventListener('change',update);document.getElementById('reset').onclick=()=>{msg.value=7;ex.value=3;update()};ex.value=3;update();</script></body></html>
